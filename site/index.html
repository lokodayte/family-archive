<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3ead8">
  <title>Family Archive</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">❦</span> <span class="brand-title">Family Archive</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-page="home">Home</a>
      <a href="#/people" data-page="people">Everyone</a>
      <a href="#/tree" data-page="tree">Tree</a>
    </nav>
    <div id="lock-slot" class="lock-slot"></div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="loading">Opening the archive…</p>
  </main>

  <footer class="site-footer">
    <p>A private family archive · <a href="admin/">Admin</a></p>
  </footer>

  <dialog id="unlock-dialog" class="dialog">
    <form method="dialog">
      <h2>Family password</h2>
      <p class="muted">Ask a family member for the password. It unlocks the private pages on this device only.</p>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <label class="check"><input type="checkbox" name="remember" checked> Remember on this device</label>
      <p class="form-message" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-quiet" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="notice">This archive needs JavaScript turned on.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
